_metadata:
  major_version: 1
display_information:
  name: Toy Box
  description: Channel monitoring and threaded answers from your local Toy Box lead
  background_color: "#4a154b"
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: false
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: toy-box
    always_online: false
oauth_config:
  scopes:
    bot:
      - channels:history
      - channels:read
      - groups:history
      - groups:read
      - files:read
      - files:write
      - users:read
      - chat:write
      - metadata.message:read
      - reactions:write
settings:
  socket_mode_enabled: true
  org_deploy_enabled: false
  token_rotation_enabled: false
  event_subscriptions:
    bot_events:
      - message.channels
      - message.groups
      - member_left_channel
      - channel_archive
      - channel_deleted
      - group_deleted
      - app_uninstalled
      - tokens_revoked
      - channel_shared
      - channel_id_changed
